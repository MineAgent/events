plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
}

version = project.version
group = project.group

base {
	archivesName = project.archives_base_name
}

repositories {
	mavenCentral()
}

dependencies {
	// Minecraft 26.1+ ships unobfuscated (official names), so Loom needs no `mappings` dependency.
	minecraft "com.mojang:minecraft:${project.minecraft_version}"

	// Loader only: this is a pure client mod and deliberately does not depend on Fabric API.
	// Events are read from the vanilla packets the client already receives, so the mod also
	// works when joining a vanilla/other-server.
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"

	// Baritone 的 API，仅编译期使用：运行时由 mods/ 里的 Baritone 提供，
	// 没装 Baritone 时相关类不会被加载。
	compileOnly files('libs/baritone-api-fabric-1.19.0.jar')

	// MGHttpdProvider 的注册 API，仅编译期使用：没装 provider 时不挂 /evt，也
	// 不会加载引用它的类。
	compileOnly files('libs/httpdprovider-1.1.1.jar')
}

processResources {
	def modVersion = project.version
	inputs.property "version", modVersion

	filesMatching("fabric.mod.json") {
		expand "version": modVersion
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
	it.options.encoding = "UTF-8"
}

java {
	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
	withSourcesJar()
}

tasks.named('jar') {
	// Reproducible archives.
	preserveFileTimestamps = false
	reproducibleFileOrder = true

	manifest {
		attributes(
				'Implementation-Title': 'MC Event Reporter',
				'Implementation-Version': project.version
		)
	}
}

tasks.matching { it.name == 'remapJar' }.configureEach {
	archiveFileName = "mc-event-${project.version}.jar"
}
